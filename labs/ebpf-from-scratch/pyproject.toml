[project]
name = "ebpf-from-scratch"
version = "0"
description = "A CO-RE eBPF program and its Python loader, for the eBPF from scratch workshop"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-sdk>=1.34",
    "opentelemetry-exporter-otlp-proto-http>=1.34",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agentwatch", "events", "launch", "libbpf", "process_scope", "telemetry"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not kernel"]
markers = [
    "unit: fast tests with no kernel involvement",
    "integration: portable subprocess checks without kernel enforcement",
    "kernel: requires root, cgroup v2, BTF and BPF LSM on Linux 5.14+",
]
