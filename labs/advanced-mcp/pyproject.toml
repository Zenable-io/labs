[project]
name = "advanced-mcp-lab"
version = "0.1.0"
description = "MCP step-up authorization, cache isolation, and idempotent retries"
requires-python = ">=3.11"
dependencies = [
    "fastmcp-slim[client,server]==4.0.11",
    "httpx2>=2.13.1,<3",
    "joserfc>=1.5.0,<2",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "pydantic>=2.12.0,<3",
    "starlette>=1.0.1,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["advanced_mcp"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: deterministic cache and identity checks",
    "integration: real loopback HTTP, OAuth, and MCP calls",
]
