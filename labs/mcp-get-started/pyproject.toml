[project]
name = "mcp-get-started"
version = "0"
description = "An MVP MCP server and scripted client for the MCP 101 workshop"
requires-python = ">=3.11"
dependencies = [
    # Deliberately not on the release cooldown the other labs use. This lab
    # teaches the SEP-2663 tasks extension, which only exists in fastmcp 4 —
    # released 2026-08-31, days before this floor. A cooldown on the very
    # thing the lab is about would leave the lock unsatisfiable rather than
    # safe, so this project resolves against current PyPI.
    "fastmcp[tasks]>=4.0.2,<5",
]

[tool.uv]
package = false
