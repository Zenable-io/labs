[project]
name = "a2a-workshop-agents"
version = "0"
description = "Two deterministic A2A agents authenticated by Keycloak"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server,signing]>=1.1.2",
    "pyjwt[crypto]>=2.10.1",
    "httpx>=0.28.1",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = false
# Adopt only packages published more than a week ago, so a compromised
# release has time to surface before a lab installs it. Enforced by the
# resolver, so `uv lock --upgrade` and a reader's `uv sync` obey it alike.
exclude-newer = "7 days"
