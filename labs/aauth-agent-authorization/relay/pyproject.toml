[project]
name = "aauth-relay"
version = "0.1.0"
description = "A resource that calls a downstream resource as an agent, chaining the caller's authorization"
requires-python = ">=3.11"
dependencies = [
    "aauth==0.3.2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pyjwt>=2.10,<3",
    "opentelemetry-distro>=0.66b0,<1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<1",
    "opentelemetry-instrumentation-httpx>=0.66b0,<1",
]

[tool.uv]
package = false
exclude-newer = "7 days"
