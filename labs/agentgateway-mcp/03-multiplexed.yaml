# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Step 3: two servers behind one endpoint. Tool names gain a target prefix so
# they cannot collide.
config:
  # The admin API and the built-in UI. Bound to all interfaces because the
  # default is the container's own localhost, which nothing outside can reach.
  adminAddr: 0.0.0.0:15000
  logging:
    # One JSON object per request instead of a line of key=value. Same fields,
    # but `jq` can read them, which is what makes the access log queryable.
    format: json
  tracing:
    otlpEndpoint: http://jaeger:4317
    # Every request, because a lab that samples 1% shows the reader nothing.
    randomSampling: "true"
binds:
- port: 3000
  listeners:
  - routes:
    - backends:
      - mcp:
          targets:
          - name: get-started
            mcp:
              host: http://mcp-get-started:8000/mcp
          - name: tickets
            mcp:
              host: http://tickets:8000/mcp
