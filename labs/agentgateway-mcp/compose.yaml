name: agentgateway-mcp

services:
  # `server.py` here is a deliberate copy of the one in the mcp-get-started
  # lab, not a build of that directory. Every lab builds only from its own
  # directory, so editing one can never change what another one runs, and a
  # reader can clone a single lab and have everything it needs.
  # `network: host` on both builds, because the Zenable sandbox has IPv6-only
  # egress and Docker's build network is IPv4-only. Without it every `pip
  # install` in these Dockerfiles fails with what reads as a DNS error, while
  # the host resolves the same name fine through DNS64/NAT64. Pulls are
  # unaffected -- the daemon runs on the host stack -- so only builds need it.
  mcp-get-started:
    build:
      context: .
      dockerfile: Dockerfile.get-started
      network: host
    container_name: mcp-get-started

  tickets:
    build:
      context: .
      dockerfile: Dockerfile.tickets
      network: host
    container_name: tickets

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    environment:
      # Jaeger accepts OTLP directly with this set, so the stack needs no
      # separate collector.
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:v1.5.0
    container_name: agentgateway
    command: ["-f", "/cfg/config.yaml"]
    volumes:
      # The DIRECTORY, not the file. agentgateway watches the config path and
      # reloads on change, and a bind-mounted single file does not deliver the
      # event that `cp` over it produces.
      - ./:/cfg:ro
    ports:
      # MCP traffic, the admin API and built-in UI, and Prometheus metrics.
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:15000:15000"
      - "127.0.0.1:15020:15020"
    depends_on:
      - mcp-get-started
      - tickets
      - jaeger
