[project]
name = "agentgateway-mcp"
version = "0.1.0"
description = "agentgateway in front of an MCP server: observability, routing, and control"
requires-python = ">=3.11"
dependencies = [
    # client.py names the exceptions it catches, and httpx raises one of them.
    "httpx>=0.28,<1",
    "fastmcp>=3.4,<4",
]

[tool.uv]
package = false
# Adopt only packages published more than a week ago, so a compromised
# release has time to surface before a lab installs it. Enforced by the
# resolver, so `uv lock --upgrade` and a reader's `uv sync` obey it alike.
exclude-newer = "7 days"
