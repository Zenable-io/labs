[project]
name = "jev-router"
version = "0.1.0"
description = "An agentgateway ExtProc server that asks Jev which model should serve a request."
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.68.0",
    "protobuf>=5.29.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: deterministic tests without external services"]
